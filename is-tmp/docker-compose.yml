version: '3.8'

services:
  # 数据登记管理平台
  data-registry:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: data-registry
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
    networks:
      - data-registry-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # MySQL数据库（可选）
  mysql:
    image: mysql:8.0
    container_name: data-registry-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=data-registry-root
      - MYSQL_DATABASE=data-registry
      - MYSQL_USER=data-registry
      - MYSQL_PASSWORD=data-registry-pass
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - data-registry-network
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # Redis缓存（可选）
  redis:
    image: redis:7-alpine
    container_name: data-registry-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - data-registry-network
    command: redis-server --appendonly yes

networks:
  data-registry-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
