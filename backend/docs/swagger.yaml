basePath: /
definitions:
  datauptwo_app_dto.AdminEnableMFAReq:
    properties:
      code:
        type: string
      userId:
        type: integer
    required:
    - code
    - userId
    type: object
  datauptwo_app_dto.ChangePasswordReq:
    properties:
      newPassword:
        maxLength: 128
        minLength: 6
        type: string
      oldPassword:
        type: string
    required:
    - newPassword
    - oldPassword
    type: object
  datauptwo_app_dto.LoginReq:
    properties:
      captcha:
        type: string
      captchaId:
        type: string
      password:
        maxLength: 128
        minLength: 6
        type: string
      username:
        maxLength: 32
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  datauptwo_app_dto.MFAEnableReq:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  datauptwo_app_dto.MFAVerifyReq:
    properties:
      code:
        type: string
      tmpToken:
        description: 临时token，用于MFA验证
        type: string
      userId:
        type: integer
    required:
    - code
    - userId
    type: object
  datauptwo_app_dto.RegisterReq:
    properties:
      email:
        maxLength: 128
        type: string
      nickname:
        maxLength: 64
        type: string
      password:
        maxLength: 64
        minLength: 6
        type: string
      username:
        maxLength: 64
        type: string
    required:
    - password
    - username
    type: object
  datauptwo_app_dto.ResetMFAReq:
    properties:
      userId:
        type: integer
    required:
    - userId
    type: object
  datauptwo_app_dto.ResetPasswordReq:
    properties:
      newPassword:
        maxLength: 128
        minLength: 6
        type: string
      userId:
        type: integer
    required:
    - newPassword
    - userId
    type: object
  datauptwo_app_dto.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  datauptwo_app_dto.RoleCreateReq:
    properties:
      code:
        maxLength: 64
        type: string
      description:
        maxLength: 256
        type: string
      name:
        maxLength: 64
        type: string
      permissions:
        items:
          type: string
        type: array
      sort:
        type: integer
    required:
    - code
    - name
    type: object
  datauptwo_app_dto.RoleUpdateReq:
    properties:
      code:
        maxLength: 64
        type: string
      description:
        maxLength: 256
        type: string
      id:
        type: integer
      name:
        maxLength: 64
        type: string
      permissions:
        items:
          type: string
        type: array
      sort:
        type: integer
    required:
    - code
    - id
    - name
    type: object
  datauptwo_app_dto.UploadRecordCreateReq:
    properties:
      data:
        additionalProperties: true
        description: 动态字段数据
        type: object
      dataType:
        maxLength: 64
        type: string
      filePath:
        maxLength: 512
        type: string
      fileSize:
        minimum: 0
        type: integer
      projectName:
        maxLength: 128
        type: string
      remark:
        maxLength: 512
        type: string
      status:
        type: string
      uploader:
        maxLength: 64
        type: string
    required:
    - dataType
    - filePath
    - uploader
    type: object
  datauptwo_app_dto.UploadRecordUpdateReq:
    properties:
      data:
        additionalProperties: true
        description: 动态字段数据
        type: object
      id:
        type: integer
      remark:
        maxLength: 512
        type: string
      status:
        enum:
        - pending
        - processing
        - completed
        - failed
        type: string
    required:
    - id
    - status
    type: object
  datauptwo_app_dto.UserCreateReq:
    properties:
      email:
        type: string
      groupId:
        type: integer
      mfaEnabled:
        type: boolean
      nickname:
        maxLength: 64
        type: string
      password:
        maxLength: 128
        minLength: 6
        type: string
      phone:
        maxLength: 32
        type: string
      roleId:
        type: integer
      status:
        type: string
      username:
        maxLength: 32
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  datauptwo_app_dto.UserGroupCreateReq:
    properties:
      code:
        maxLength: 64
        type: string
      description:
        maxLength: 256
        type: string
      name:
        maxLength: 64
        type: string
      sort:
        type: integer
    required:
    - code
    - name
    type: object
  datauptwo_app_dto.UserGroupUpdateReq:
    properties:
      code:
        maxLength: 64
        type: string
      description:
        maxLength: 256
        type: string
      id:
        type: integer
      name:
        maxLength: 64
        type: string
      sort:
        type: integer
    required:
    - code
    - id
    - name
    type: object
  datauptwo_app_dto.UserUpdateReq:
    properties:
      email:
        type: string
      groupId:
        type: integer
      id:
        type: integer
      mfaEnabled:
        type: boolean
      nickname:
        maxLength: 64
        type: string
      phone:
        maxLength: 32
        type: string
      roleId:
        type: integer
      status:
        type: string
    required:
    - id
    type: object
