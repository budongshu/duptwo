# ============================================================
# datauptwo Center 配置 - 生产环境
# 说明: 中心站点，接收所有 Agent 的数据上报
# ============================================================

base:
  mode: prod
  port: 18421
  username: ""                    # 必填：管理员用户名
  password: ""                    # 必填：管理员密码（请使用强密码）
  version: v1.0.0
  language: zh
  install_dir: ./data_center      # 数据目录（数据库、日志均在此目录下）
  serve_web: true                # 是否提供 Web 管理界面

database:

  # SQLite 备选（单机部署）
  type: sqlite
  path: ./data_center/duptwo.db

log:
  level: info                   # info / debug / warn / error
  time_zone: Asia/Shanghai
  log_name: center              # 日志文件前缀
  max_backup: 30               # 保留最近 N 天的日志
  max_size: 100                 # 单个日志文件最大 MB

session:
  timeout: 7200                # 会话超时（秒），建议 2 小时
  secret: "AJtGnt9enlhfemz9UVlTtMjkuxiNpNIZ"                    # 必填：随机生成的 32+ 字符密钥

cors:
  allow_origins:
    - "*"
    - "https://duptwo.your-domain.com"   # 替换为实际域名
    # - "https://admin.your-domain.com"   # 管理后台域名
  allow_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allow_headers:
    - Origin
    - Content-Type
    - Authorization
    - Accept-Language
    - X-Submit-Source
    - X-API-Key
    - X-Token
  max_age: 86400

jwt:
  secret: "E1U4JvPDkPxt8MnsnnF5r7u4ix4bVeCj"                    # 必填：随机生成的 JWT 签名密钥（与 session.secret 不同）

sync:
  # ===== 同步模式 =====
  mode: center                  # center：中心站点，接收 Agent 推送

  center:
    heartbeat_timeout: 120      # Agent 心跳超时时间（秒），超过此时间无心跳视为离线
                                # 建议值：Agent 心跳间隔的 2-3 倍
  agent:
    # Agent 模式配置（此处不适用，但字段必须存在）
    center_url: ""
    station_id: ""
    station_name: ""
    url: ""
    interval: "1m"
    batch_size: 100
    retry_count: 3
    retry_interval: "1m"
    heartbeat_interval: "60s"
    filter:
      project_names: []
    proxy:
      enabled: false
      url: ""
