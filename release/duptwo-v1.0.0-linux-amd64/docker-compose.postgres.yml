# ============================================================
# duptwo Docker Compose（PostgreSQL 生产版）
# 适用于生产环境，高并发和强一致性场景
# ============================================================

services:
  app:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
    container_name: duptwo-app
    restart: unless-stopped
    ports:
      - "18421:18421"
    environment:
      - TZ=Asia/Shanghai
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=duptwo
      - DB_PASSWORD=duptwo_secure_pass
      - DB_NAME=duptwo
    volumes:
      - app-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18421/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - duptwo
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: duptwo-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=duptwo
      - POSTGRES_USER=duptwo
      - POSTGRES_PASSWORD=duptwo_secure_pass
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duptwo -d duptwo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - duptwo

  nginx:
    image: nginx:1.27-alpine
    container_name: duptwo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - duptwo

volumes:
  postgres-data:
    driver: local
  app-logs:
    driver: local

networks:
  duptwo:
    driver: bridge
