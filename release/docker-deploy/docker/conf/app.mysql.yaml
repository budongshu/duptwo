# ============================================================
# duptwo 生产环境配置（MySQL 版）
# 适用于生产环境，支持高并发和数据持久化
# ============================================================

base:
  mode: prod
  port: 18421
  version: v1.0.0
  language: zh
  serve_web: true

database:
  type: mysql
  host: mysql
  port: 3306
  user: duptwo
  pass: duptwo_secure_pass
  name: duptwo
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600

log:
  level: info
  time_zone: Asia/Shanghai
  log_name: duptwo
  max_backup: 30
  max_size: 100

session:
  timeout: 86400  # 24小时
  secret: CHANGE_THIS_SECRET_IN_PRODUCTION_32CHARS

cors:
  allow_origins:
    - "http://localhost"
    - "http://localhost:8080"
    - "https://your-domain.com"
  allow_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allow_headers:
    - Origin
    - Content-Type
    - Authorization
    - Accept-Language
    - X-Submit-Source
    - X-API-Key
    - X-Token
  max_age: 86400

jwt:
  secret: CHANGE_THIS_JWT_SECRET_IN_PRODUCTION
