# ============================================================
# datauptwo 统一配置文件
# 所有环境共用此配置，通过 python3 config_gen.py 生成各环境专用配置
# 密钥自动生成，无需手动填写
# ============================================================

# ========== 基础配置 ==========
app:
  name: datauptwo
  version: v1.0.0
  # 监听端口（开发用 18421，生产用 8080）
  port: 18421
  # dev | prod
  mode: prod
  # 是否提供前端静态文件
  serve_web: true
  timezone: Asia/Shanghai

# ========== 数据库配置 ==========
# 三选一：enabled=true 的配置会被生成到后端配置
database:
  sqlite:
    enabled: true
    path: ./data/registry.db
  mysql:
    enabled: false
    host: mysql
    port: 3306
    user: datauptwo
    pass: CHANGE_IN_PRODUCTION
    name: datauptwo
  postgres:
    enabled: false
    host: postgres
    port: 5432
    user: datauptwo
    pass: CHANGE_IN_PRODUCTION
    name: datauptwo

# ========== 安全配置 ==========
# jwt_secret 和 session_secret 由 config_gen.py 自动生成，无需填写
security:
  # 管理员密码（可改）
  admin_password: admin123
  # Session 超时（秒）
  session_timeout: 7200

# ========== CORS 配置 ==========
cors:
  allow_origins:
    - http://localhost
    - http://localhost:8080
    - http://localhost:4004
    - http://duptwo.ecarxmap.com
    - https://duptwo.ecarxmap.com
  allow_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allow_headers:
    - Origin
    - Content-Type
    - Authorization
    - Accept-Language
    - X-Submit-Source
    - X-API-Key
    - X-Token
  max_age: 86400

# ========== 日志配置 ==========
logging:
  level: info
  log_name: datauptwo
  max_backup: 30
  max_size: 100

# ========== 部署配置 ==========
deploy:
  image_registry: registry.example.com
  image_name: datauptwo
  http_port: 80
  https_port: 443
  external_port: 8080
  storage_size: 10Gi
  replicas: 2
  domain: datauptwo.example.com
