# 生产环境配置（MySQL）
# 部署后复制到 conf/app.yaml，或通过环境变量覆盖

base:
  mode: prod
  port: 8080
  username: admin
  password: admin123
  version: v1.0.0
  language: zh
  install_dir: ./data
  serve_web: true

database:
  type: mysql
  host: mysql
  port: 3306
  user: duptwo
  pass: duptwo@2024
  name: duptwo
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600

log:
  level: info
  time_zone: Asia/Shanghai
  log_name: duptwo
  max_backup: 30
  max_size: 100

session:
  timeout: 7200
  secret: CHANGE_THIS_SECRET_IN_PRODUCTION_32CHARS

cors:
  allow_origins:
    - "http://localhost"
    - "https://your-domain.com"
  allow_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allow_headers:
    - Origin
    - Content-Type
    - Authorization
    - Accept-Language
    - X-Submit-Source
    - X-API-Key
    - X-Token
  max_age: 86400

jwt:
  secret: CHANGE_THIS_JWT_SECRET_IN_PRODUCTION
