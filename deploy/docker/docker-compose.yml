# ============================================================
# duptwo Docker Compose（MySQL 版，推荐生产环境）
# 来源: deploy/config.yaml
# ============================================================

services:
  mysql:
    image: mysql:8.0
    container_name: duptwo-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-duptwo@2024}
      - MYSQL_DATABASE=duptwo
      - TZ=Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - duptwo

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: duptwo-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Shanghai
      - DB_TYPE=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-duptwo@2024}
      - DB_NAME=duptwo
    volumes:
      - app-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - duptwo

  nginx:
    image: nginx:1.27-alpine
    container_name: duptwo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - duptwo

volumes:
  mysql-data:
    driver: local
  app-logs:
    driver: local

networks:
  duptwo:
    driver: bridge
