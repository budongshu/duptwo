# ============================================================
# duptwo Docker Compose（默认：SQLite 轻量版）
# 使用 docker-compose.yml 或 docker-compose.sqlite.yml 启动 SQLite 版本
# 使用 docker-compose.mysql.yml 启动 MySQL 版本
#
# 使用方式（从项目根目录运行）：
#   nerdctl compose -f deploy/docker/docker-compose.yml up -d
# ============================================================

services:
  app:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
    container_name: duptwo-app
    restart: unless-stopped
    ports:
      - "18421:18421"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./conf/app.sqlite.yaml:/app/conf/app.yaml:ro
      - app-data:/app/data
      - app-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18421/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - duptwo

  nginx:
    image: nginx:1.27-alpine
    container_name: duptwo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - duptwo

volumes:
  app-data:
    driver: local
  app-logs:
    driver: local

networks:
  duptwo:
    driver: bridge
