# ============================================================
# duptwo Docker Compose（MySQL 生产版）
# 适用于生产环境，支持高并发和数据持久化
#
# 使用方式（从项目根目录运行）：
#   nerdctl compose -f deploy/docker/docker-compose.mysql.yml up -d
# ============================================================

services:
  app:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
    container_name: duptwo-app
    restart: unless-stopped
    ports:
      - "18421:18421"
    environment:
      - TZ=Asia/Shanghai
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=duptwo
      - DB_PASSWORD=duptwo_secure_pass
      - DB_NAME=duptwo
    volumes:
      - ./conf/app.mysql.yaml:/app/conf/app.yaml:ro
      - app-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18421/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - duptwo
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: duptwo-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=duptwo_root_pass
      - MYSQL_DATABASE=duptwo
      - MYSQL_USER=duptwo
      - MYSQL_PASSWORD=duptwo_secure_pass
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pduptwo_root_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - duptwo

  nginx:
    image: nginx:1.27-alpine
    container_name: duptwo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - duptwo

volumes:
  mysql-data:
    driver: local
  app-logs:
    driver: local

networks:
  duptwo:
    driver: bridge
