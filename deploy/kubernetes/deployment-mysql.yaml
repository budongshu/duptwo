# ============================================================
# duptwo Kubernetes 部署 - MySQL 生产版
# 使用方式:
#   1. 修改镜像地址 (image)、域名 (host)、密钥 (secret)、MySQL 密码
#   2. kubectl apply -f deployment-mysql.yaml
# ============================================================

---
# -------------------- Namespace --------------------
apiVersion: v1
kind: Namespace
metadata:
  name: duptwo

---
# -------------------- ConfigMap --------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: duptwo-config
  namespace: duptwo
data:
  app.yaml: |
    base:
      mode: prod
      port: 18421
      version: v1.0.0
      language: zh
      serve_web: true
      web_root: ./web

    database:
      type: mysql
      host: mysql
      port: 3306
      user: duptwo
      pass: "DUPTWO_DB_PASSWORD"
      name: duptwo
      max_idle_conns: 10
      max_open_conns: 100
      conn_max_lifetime: 3600

    log:
      level: info
      time_zone: Asia/Shanghai
      log_name: duptwo
      max_backup: 30
      max_size: 100

    session:
      timeout: 86400
      secret: "CHANGEME_SESSION_SECRET_32CHARS"

    cors:
      allow_origins:
        - "http://localhost"
        - "http://localhost:8080"
        - "https://your-domain.com"
      allow_methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allow_headers:
        - Origin
        - Content-Type
        - Authorization
        - Accept-Language
        - X-Submit-Source
        - X-API-Key
        - X-Token
      max_age: 86400

    jwt:
      secret: "CHANGEME_JWT_SECRET"

---
# -------------------- Secret --------------------
apiVersion: v1
kind: Secret
metadata:
  name: duptwo-secret
  namespace: duptwo
type: Opaque
stringData:
  # MySQL 密码（会被注入到 ConfigMap 占位符）
  DB_PASSWORD: "duptwo_secure_pass"
  SESSION_SECRET: "CHANGEME_SESSION_SECRET_32CHARS"
  JWT_SECRET: "CHANGEME_JWT_SECRET"

---
# -------------------- PVC --------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: duptwo-data-pvc
  namespace: duptwo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

---
# -------------------- MySQL PVC --------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data-pvc
  namespace: duptwo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi

---
# -------------------- MySQL Deployment --------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: duptwo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: mysql
          image: mysql:8.0
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --default-authentication-plugin=mysql_native_password
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "duptwo_root_pass"
            - name: MYSQL_DATABASE
              value: "duptwo"
            - name: MYSQL_USER
              value: "duptwo"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: duptwo-secret
                  key: DB_PASSWORD
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-uroot", "-pduptwo_root_pass"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-uroot", "-pduptwo_root_pass"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-data-pvc

---
# -------------------- MySQL Service --------------------
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: duptwo
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      protocol: TCP
  selector:
    app: mysql

---
# -------------------- App Deployment --------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: duptwo
  namespace: duptwo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: duptwo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: duptwo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - duptwo
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-mysql
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              echo "Waiting for MySQL..."
              until nc -z mysql 3306; do
                sleep 2
              done
              echo "MySQL is ready"
      containers:
        - name: app
          # 修改为你的镜像地址，例如:
          # registry.cn-hangzhou.aliyuncs.com/your-namespace/duptwo:v1.0.0
          image: duptwo:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 18421
              protocol: TCP
          env:
            - name: TZ
              value: Asia/Shanghai
          volumeMounts:
            - name: config
              mountPath: /app/conf/app.yaml
              subPath: app.yaml
              readOnly: true
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: duptwo-config
        - name: data
          persistentVolumeClaim:
            claimName: duptwo-data-pvc
        - name: logs
          emptyDir: {}
      terminationGracePeriodSeconds: 30

---
# -------------------- App Service --------------------
apiVersion: v1
kind: Service
metadata:
  name: duptwo-svc
  namespace: duptwo
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 18421
      targetPort: http
      protocol: TCP
  selector:
    app: duptwo

---
# -------------------- Ingress --------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: duptwo-ingress
  namespace: duptwo
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    # 修改为你的域名
    - host: duptwo.your-domain.com
      http:
        paths:
          - path: /swagger
            pathType: Prefix
            backend:
              service:
                name: duptwo-svc
                port:
                  number: 18421
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: duptwo-svc
                port:
                  number: 18421
          - path: /public
            pathType: Prefix
            backend:
              service:
                name: duptwo-svc
                port:
                  number: 18421
          - path: /
            pathType: Prefix
            backend:
              service:
                name: duptwo-svc
                port:
                  number: 18421
