# ============================================================
# duptwo Kubernetes 部署清单 - SQLite 版本
# 适用于阿里云 ACK 环境
# ============================================================

---
# -------------------- ConfigMap --------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: duptwo-config
  namespace: duptwo
  labels:
    app: duptwo
    component: config
data:
  app.yaml: |
    base:
      mode: prod
      port: 18421
      version: v1.0.0
      language: zh
      install_dir: ./data
      serve_web: true
      web_root: ./web

    database:
      type: sqlite
      path: ./data/registry.db
      max_idle_conns: 10
      max_open_conns: 100
      conn_max_lifetime: 3600

    log:
      level: info
      time_zone: Asia/Shanghai
      log_name: duptwo
      max_backup: 30
      max_size: 100

    session:
      timeout: 86400
      secret: "REPLACE_WITH_SESSION_SECRET"

    cors:
      allow_origins:
        - "http://localhost"
        - "http://localhost:8080"
        - "http://localhost:18421"
        - "http://duptwo.ecarxmap.com"
        - "https://duptwo.ecarxmap.com"
      allow_methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allow_headers:
        - Origin
        - Content-Type
        - Authorization
        - Accept-Language
        - X-Submit-Source
        - X-API-Key
        - X-Token
      max_age: 86400

    jwt:
      secret: "REPLACE_WITH_JWT_SECRET"

---
# -------------------- Secret --------------------
apiVersion: v1
kind: Secret
metadata:
  name: duptwo-secret
  namespace: duptwo
  labels:
    app: duptwo
    component: secret
type: Opaque
stringData:
  SESSION_SECRET: "REPLACE_WITH_SESSION_SECRET_32CHARS"
  JWT_SECRET: "REPLACE_WITH_JWT_SECRET_32CHARS"

---
# -------------------- PersistentVolumeClaim --------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: duptwo-data-pvc
  namespace: duptwo
  labels:
    app: duptwo
    component: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # 阿里云 NAS 或云盘
  # storageClassName: nfs-csi
  # 或使用阿里云-managed-disk
  # storageClassName: alicloud-disk-efficiency

---
# -------------------- Deployment --------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: duptwo
  namespace: duptwo
  labels:
    app: duptwo
    component: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: duptwo
  # 滚动更新策略
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: duptwo
        component: app
    spec:
      # 安全上下文
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      # 初始化容器：修复数据目录权限
      initContainers:
        - name: fix-permissions
          image: busybox:latest
          command: ['sh', '-c', 'chown -R 1000:1000 /app/data /app/logs 2>/dev/null || true']
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs

      # 亲和性：优先分散到不同节点
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - duptwo
                topologyKey: kubernetes.io/hostname

      # 容器定义
      containers:
        - name: app
          # TODO: 替换为你的阿里云镜像仓库地址
          # 例如: registry.cn-hangzhou.aliyuncs.com/你的命名空间/duptwo:v1.0.0
          image: duptwo:v1.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 18421
              protocol: TCP

          env:
            - name: TZ
              value: Asia/Shanghai

          # 从 Secret 读取敏感配置（覆盖 ConfigMap 中的默认值）
          envFrom:
            - secretRef:
                name: duptwo-secret

          volumeMounts:
            - name: config
              mountPath: /app/conf/app.yaml
              subPath: app.yaml
              readOnly: true
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs

          # 资源限制
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi

          # 健康检查
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

      # 存储卷
      volumes:
        - name: config
          configMap:
            name: duptwo-config
        - name: data
          persistentVolumeClaim:
            claimName: duptwo-data-pvc
        - name: logs
          emptyDir: {}

      # 终止等待时间
      terminationGracePeriodSeconds: 30

---
# -------------------- Service --------------------
apiVersion: v1
kind: Service
metadata:
  name: duptwo-svc
  namespace: duptwo
  labels:
    app: duptwo
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 18421
      targetPort: http
      protocol: TCP
  selector:
    app: duptwo

---
# -------------------- Ingress --------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: duptwo-ingress
  namespace: duptwo
  labels:
    app: duptwo
  annotations:
    # Nginx Ingress Controller 注解
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # 阿里云 SLB 配置（如使用 ALB 可忽略）
    # service.beta.kubernetes.io/alibaba-cloud-loadbalancer-id: "lb-xxxx"
spec:
  ingressClassName: nginx
  rules:
    # TODO: 替换为你的域名
    - host: duptwo.your-domain.com
      http:
        paths:
          # Swagger API 文档
          - path: /swagger
            pathType: Prefix
            backend:
              service:
                name: duptwo-svc
                port:
                  number: 18421
          # API 接口
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: duptwo-svc
                port:
                  number: 18421
          # 公开接口
          - path: /public
            pathType: Prefix
            backend:
              service:
                name: duptwo-svc
                port:
                  number: 18421
          # 前端静态文件（必须最后匹配）
          - path: /
            pathType: Prefix
            backend:
              service:
                name: duptwo-svc
                port:
                  number: 18421
