{{- /*
Service for duptwo
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "duptwo.fullname" . }}-svc
  labels:
    {{- include "duptwo.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "duptwo.selectorLabels" . | nindent 4 }}
