{{- /*
Deployment for duptwo - MySQL version (使用云 PaaS MySQL)
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "duptwo.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "duptwo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "duptwo.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "duptwo.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "duptwo.fullname" . }}-secret
                  key: SESSION_SECRET
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "duptwo.fullname" . }}-secret
                  key: JWT_SECRET
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ include "duptwo.fullname" . }}-secret
                  key: MYSQL_HOST
            - name: MYSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ include "duptwo.fullname" . }}-secret
                  key: MYSQL_PORT
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "duptwo.fullname" . }}-secret
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "duptwo.fullname" . }}-secret
                  key: MYSQL_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "duptwo.fullname" . }}-secret
                  key: MYSQL_DATABASE
          volumeMounts:
            - name: config
              mountPath: /app/conf/app.yaml
              subPath: app.yaml
              readOnly: true
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
          resources:
            {{- toYaml .Values.resources | nindent 10 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
      volumes:
        - name: config
          configMap:
            name: {{ include "duptwo.fullname" . }}-config
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "duptwo.fullname" . }}-data-pvc
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}
        - name: logs
          emptyDir: {}
      terminationGracePeriodSeconds: 30
