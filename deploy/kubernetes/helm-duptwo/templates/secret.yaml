{{- /*
Secret for duptwo - MySQL version (使用云 PaaS MySQL)
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "duptwo.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "duptwo.labels" . | nindent 4 }}
type: Opaque
stringData:
  # 应用密钥
  SESSION_SECRET: {{ .Values.secret.sessionSecret }}
  JWT_SECRET: {{ .Values.secret.jwtSecret }}
  # MySQL 连接信息
  MYSQL_HOST: {{ .Values.mysql.externalHost | required "mysql.externalHost is required (e.g., rm-xxxxx.mysql.rds.aliyuncs.com)" }}
  MYSQL_PORT: {{ .Values.mysql.externalPort | default 3306 | quote }}
  MYSQL_USER: {{ .Values.mysql.username }}
  MYSQL_PASSWORD: {{ .Values.mysql.password | required "mysql.password is required" }}
  MYSQL_DATABASE: {{ .Values.mysql.database }}
