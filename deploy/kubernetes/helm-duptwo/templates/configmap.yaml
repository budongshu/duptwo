{{- /*
ConfigMap for duptwo application
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "duptwo.fullname" . }}-config
  labels:
    {{- include "duptwo.labels" . | nindent 4 }}
data:
  app.yaml: |
    base:
      mode: prod
      port: 18421
      version: {{ .Chart.AppVersion }}
      language: zh
      install_dir: ./data
      serve_web: true
      web_root: ./web

    database:
      type: sqlite
      path: ./data/registry.db
      max_idle_conns: 10
      max_open_conns: 100
      conn_max_lifetime: 3600

    log:
      level: info
      time_zone: Asia/Shanghai
      log_name: duptwo
      max_backup: 30
      max_size: 100

    session:
      timeout: 86400
      secret: "{{ .Values.secret.sessionSecret }}"

    cors:
      allow_origins:
        - "http://localhost"
        - "http://localhost:8080"
        - "http://localhost:18421"
        - "http://{{ .Values.ingress.host }}"
        - "https://{{ .Values.ingress.host }}"
      allow_methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allow_headers:
        - Origin
        - Content-Type
        - Authorization
        - Accept-Language
        - X-Submit-Source
        - X-API-Key
        - X-Token
      max_age: 86400

    jwt:
      secret: "{{ .Values.secret.jwtSecret }}"
