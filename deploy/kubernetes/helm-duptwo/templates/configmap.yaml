{{- /*
ConfigMap for duptwo - MySQL version (使用云 PaaS MySQL)
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "duptwo.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "duptwo.labels" . | nindent 4 }}
data:
  app.yaml: |
    base:
      mode: prod
      port: {{ .Values.service.port }}
      version: {{ .Values.image.tag }}
      language: zh
      install_dir: ./data
      serve_web: true
      web_root: ./web

    database:
      type: mysql
      host: ${MYSQL_HOST}
      port: ${MYSQL_PORT}
      user: ${MYSQL_USER}
      pass: ${MYSQL_PASSWORD}
      name: ${MYSQL_DATABASE}
      max_idle_conns: 10
      max_open_conns: 100
      conn_max_lifetime: 3600

    log:
      level: info
      time_zone: Asia/Shanghai
      log_name: duptwo
      max_backup: 30
      max_size: 100

    session:
      timeout: 86400
      secret: ${SESSION_SECRET}

    cors:
      allow_origins:
        - "http://localhost"
        - "http://localhost:8080"
        - "http://{{ .Values.ingress.host }}"
        - "https://{{ .Values.ingress.host }}"
      allow_methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allow_headers:
        - Origin
        - Content-Type
        - Authorization
        - Accept-Language
        - X-Submit-Source
        - X-API-Key
        - X-Token
      max_age: 86400

    jwt:
      secret: ${JWT_SECRET}
