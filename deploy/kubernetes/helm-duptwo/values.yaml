# Default values for duptwo - MySQL 生产版
# 使用云 PaaS MySQL

replicaCount: 2

image:
  repository: duptwo
  tag: v1.0.0
  pullPolicy: IfNotPresent

imagePullSecrets: []
# 示例（需要提前创建 Secret）:
# - name: aliyun-registry

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 18421

ingress:
  enabled: true
  className: nginx
  # TODO: 替换为你的域名
  host: duptwo.your-domain.com
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"

# MySQL 云 PaaS 配置（必填）
mysql:
  externalHost: ""  # 例如: rm-xxxxx.mysql.rds.aliyuncs.com
  externalPort: 3306
  database: duptwo
  username: duptwo
  password: ""  # 通过 --set 传入

# PVC 配置（MySQL 模式下可禁用）
persistence:
  enabled: false
  storageClass: ""
  size: 10Gi

# 资源配置
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

# 安全配置
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# 探针配置
livenessProbe:
  initialDelaySeconds: 15
  periodSeconds: 15

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10

# 敏感配置（通过 --set 传入）
secret:
  sessionSecret: "REPLACE_WITH_SESSION_SECRET_32CHARS"
  jwtSecret: "REPLACE_WITH_JWT_SECRET_32CHARS"
